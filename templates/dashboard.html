<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>🍽️ 北京交通大学食堂仿真</title>

<style>
/*
 * 修改人：邓武轩

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #2563eb;
    --primary-dark: #1e3a8a;
    --primary-light: #60a5fa;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #06b6d4;
    --bg-deep: #0f172a;
    --bg-card: rgba(255, 255, 255, 0.96);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-soft: rgba(148, 163, 184, 0.24);
    --shadow-card: 0 16px 40px rgba(15, 23, 42, 0.12);
    --shadow-hover: 0 20px 50px rgba(37, 99, 235, 0.18);
}

body {
    font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    min-width: 1400px;
    min-height: 100vh;
    padding: 24px;
    overflow-x: auto;
    color: var(--text-main);
    background:
        radial-gradient(circle at 12% 15%, rgba(59, 130, 246, 0.36), transparent 32%),
        radial-gradient(circle at 85% 8%, rgba(14, 165, 233, 0.32), transparent 26%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 42%, #0f172a 100%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: 0.35;
}

h1 {
    position: relative;
    margin-bottom: 18px;
    padding: 24px 28px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    color: #ffffff;
    font-size: 30px;
    letter-spacing: 1px;
    background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.88), rgba(15, 23, 42, 0.72)),
        linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.26);
    overflow: hidden;
}

h1::after {
    content: "实时运行监控平台 · Simulation Dashboard";
    display: block;
    margin-top: 8px;
    color: rgba(255, 255, 255, 0.78);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.debug-panel {
    position: relative;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
    padding: 12px 18px;
    border: 1px solid rgba(191, 219, 254, 0.28);
    border-radius: 16px;
    color: #dbeafe;
    font-size: 14px;
    background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(14px);
}

.debug-panel strong {
    color: #ffffff;
}

.error {
    color: #fecaca;
    font-weight: 700;
}

.stats-panel {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 18px;
}

.stat-item {
    min-height: 104px;
    padding: 20px 22px;
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 15px;
    background: var(--bg-card);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(16px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.stat-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
}

.stat-value {
    display: block;
    margin-top: 12px;
    margin-left: 0;
    color: var(--primary);
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
}

/*
 * 修改人：邓武轩

.canteen-overview {

}

.canteen-overview-title {

    align-items: center;

.canteen-overview-title h2 {

}

.canteen-overview-title span {

}

.canteen-grid {

}

.canteen-card {

.canteen-name {

}

.canteen-status-tag {

canvas {

<script>
(function() {
    const socket = io();

/*
 * 修改人：邓武轩
 * 修改时间：2026-05-18
 * 修改原因：统一图表视觉风格，让实时监控图表更适合课程展示和答辩演示。
 * 修改范围：仅新增前端图表辅助函数，不影响后端接口和仿真逻辑。
 */
function hexToRgba(hex, opacity) {
    const cleanHex = hex.replace('#', '');
    const bigint = parseInt(cleanHex, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${opacity})`;
}

function buildLineDataset(name, index, colors, fillOpacity) {
    const color = colors[index % colors.length];

    return {
        label: name,
        data: [],
        borderColor: color,
        backgroundColor: hexToRgba(color, fillOpacity),
        borderWidth: 2.5,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHitRadius: 12,
        tension: 0.36,
        fill: fillOpacity > 0,
        spanGaps: true
    };
}

function buildChartOptions(yTitle) {
    return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
            mode: 'index',
            intersect: false
        },
        animation: {
            duration: 320,
            easing: 'easeOutQuart'
        },
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    usePointStyle: true,
                    boxWidth: 8,
                    boxHeight: 8,
                    padding: 14,
                    font: {
                        size: 12,
                        family: 'Microsoft YaHei'
                    }
                }
            },
            tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.92)',
                titleColor: '#ffffff',
                bodyColor: '#e2e8f0',
                padding: 12,
                cornerRadius: 10,
                displayColors: true
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: '仿真时间（分钟）',
                    color: '#64748b'
                },
                grid: {
                    color: 'rgba(148, 163, 184, 0.16)'
                },
                ticks: {
                    color: '#64748b',
                    maxRotation: 0
                }
            },
            y: {
                beginAtZero: true,
                title: {
                    display: true,
                    text: yTitle,
                    color: '#64748b'
                },
                grid: {
                    color: 'rgba(148, 163, 184, 0.18)'
                },
                ticks: {
                    color: '#64748b',
                    precision: 0
                }
            }
        }
    };
}

    // 辅助函数：从后端获取窗口名列表
    async function fetchWindowNames() {
        const res = await fetch('/api/windows');
        const names = await res.json();
        return names;
    }

/*
 * 修改人：邓武轩
 * 修改时间：2026-05-18
 * 修改原因：新增食堂运行状态总览卡片的数据加载与渲染逻辑。
 * 修改范围：只读取 /api/canteens/status 接口，不改变原有图表和 Socket 数据流。
 */
function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function getCanteenPressure(totalQueue, occupancyRate) {
    if (totalQueue >= 12 || occupancyRate >= 80) {
        return { text: '高峰拥挤', className: 'crowded' };
    }

    if (totalQueue >= 6 || occupancyRate >= 55) {
        return { text: '运行繁忙', className: 'busy' };
    }

    return { text: '运行平稳', className: '' };
}

function renderCanteenOverview(statusList) {
    const grid = document.getElementById('canteen-overview-grid');
    if (!grid) return;

    if (!Array.isArray(statusList) || statusList.length === 0) {
        grid.innerHTML = '<div class="canteen-empty">暂无食堂状态数据</div>';
        return;
    }

    grid.innerHTML = statusList.map(canteen => {
        const totalQueue = Number(canteen.total_queue || 0);
        const freeSeats = Number(canteen.free_seats || 0);
        const totalSeats = Number(canteen.total_seats || 0);
        const occupancyRate = Number(canteen.occupancy_rate || 0);
        const windows = Array.isArray(canteen.windows) ? canteen.windows : [];
        const pressure = getCanteenPressure(totalQueue, occupancyRate);

        return `
            <div class="canteen-card">
                <div class="canteen-card-header">
                    <div>
                        <div class="canteen-name">${escapeHtml(canteen.name)}</div>
                        <span class="canteen-status-tag ${pressure.className}">${pressure.text}</span>
                    </div>
                    <div class="canteen-queue-number">
                        ${totalQueue}
                        <span class="canteen-queue-label">排队人数</span>
                    </div>
                </div>

                <div class="canteen-metrics">
                    <div class="canteen-metric">
                        <strong>${windows.length}</strong>
                        <span>开放窗口</span>
                    </div>
                    <div class="canteen-metric">
                        <strong>${freeSeats}</strong>
                        <span>空闲座位</span>
                    </div>
                    <div class="canteen-metric">
                        <strong>${occupancyRate.toFixed(1)}%</strong>
                        <span>座位占用</span>
                    </div>
                </div>

                <div class="occupancy-bar">
                    <span style="width: ${Math.max(0, Math.min(100, occupancyRate))}%"></span>
                </div>
            </div>
        `;
    }).join('');
}

async function loadCanteenStatus() {
    try {
        const res = await fetch('/api/canteens/status');
        const data = await res.json();

        if (data.error) {
            throw new Error(data.error);
        }

        latestCanteenStatus = data;
        renderCanteenOverview(latestCanteenStatus);
    } catch (error) {
        const grid = document.getElementById('canteen-overview-grid');
        if (grid) {
            grid.innerHTML = `<div class="canteen-empty">食堂状态加载失败：${escapeHtml(error.message)}</div>`;
        }
    }
}

    // 动态初始化/更新图表（完全重建）
/*
 * 修改人：邓武轩
 * 修改时间：2026-05-18
 * 修改原因：升级三张核心监控图表的视觉效果，使折线趋势、排队压力和窗口对比更加清晰。
 * 修改范围：仅重建 Chart.js 图表配置，不改变后端数据结构和接口调用方式。
 */
async function rebuildCharts() {
    const names = await fetchWindowNames();

    if (names.length === 0) return;

    currentWindowNames = names;

    const colors = [
        '#2563eb',
        '#f97316',
        '#22c55e',
        '#ef4444',
        '#8b5cf6',
        '#06b6d4',
        '#eab308',
        '#14b8a6',
        '#64748b',
        '#db2777'
    ];

    if (servedChart) servedChart.destroy();
    if (queueChart) queueChart.destroy();
    if (barChart) barChart.destroy();

    const servedCtx = document.getElementById('servedChart').getContext('2d');
    servedChart = new Chart(servedCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: names.map((name, index) => buildLineDataset(name, index, colors, 0.08))
        },
        options: buildChartOptions('累计服务人数')
    });

    const queueCtx = document.getElementById('queueChart').getContext('2d');
    queueChart = new Chart(queueCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: names.map((name, index) => buildLineDataset(name, index, colors, 0.14))
        },
        options: buildChartOptions('实时排队人数')
    });

    const barCtx = document.getElementById('barChart').getContext('2d');
    barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
            labels: names,
            datasets: [
                {
                    label: '当前排队人数',
                    data: new Array(names.length).fill(0),
                    backgroundColor: 'rgba(37, 99, 235, 0.82)',
                    borderColor: '#2563eb',
                    borderWidth: 1,
                    borderRadius: 10,
                    maxBarThickness: 34
                },
                {
                    label: '累计服务人数',
                    data: new Array(names.length).fill(0),
                    backgroundColor: 'rgba(34, 197, 94, 0.82)',
                    borderColor: '#22c55e',
                    borderWidth: 1,
                    borderRadius: 10,
                    maxBarThickness: 34
                }
            ]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 320,
                easing: 'easeOutQuart'
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        usePointStyle: true,
                        boxWidth: 8,
                        boxHeight: 8,
                        padding: 14,
                        font: {
                            size: 12,
                            family: 'Microsoft YaHei'
                        }
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.92)',
                    titleColor: '#ffffff',
                    bodyColor: '#e2e8f0',
                    padding: 12,
                    cornerRadius: 10
                }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(148, 163, 184, 0.18)'
                    },
                    ticks: {
                        color: '#64748b',
                        precision: 0
                    }
                },
                y: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        color: '#334155',
                        font: {
                            size: 12,
                            family: 'Microsoft YaHei'
                        }
                    }
                }
            }
        }
    });
}

    function updateChartsFromSnapshot(data) {
        if (!servedChart || !queueChart || !barChart) return;
        // 更新折线图
        servedChart.data.labels.push(data.time);
        queueChart.data.labels.push(data.time);
        currentWindowNames.forEach((name, idx) => {
            const win = data.windows?.[name];
            servedChart.data.datasets[idx].data.push(win ? win.total_served : null);
            queueChart.data.datasets[idx].data.push(win ? win.queue_length : null);
        });
        const maxPoints = 80;
        if (servedChart.data.labels.length > maxPoints) {
            servedChart.data.labels.shift();
            servedChart.data.datasets.forEach(ds => ds.data.shift());
            queueChart.data.labels.shift();
            queueChart.data.datasets.forEach(ds => ds.data.shift());
        }
        servedChart.update();
        queueChart.update();
        // 更新柱状图
        const queueData = [], servedData = [];
        currentWindowNames.forEach(name => {
            const win = data.windows?.[name];
            queueData.push(win ? win.queue_length : 0);
            servedData.push(win ? win.total_served : 0);
        });
        barChart.data.datasets[0].data = queueData;
        barChart.data.datasets[1].data = servedData;
        barChart.update();
    }

    function addActivityLog(log) {
        activityLogs.unshift(log);
        if (activityLogs.length > 100) activityLogs.pop();
        const container = document.getElementById('activity-feed');
        if (activityLogs.length === 0) { container.innerHTML = '<div class="activity-item">暂无活动</div>'; return; }
        container.innerHTML = activityLogs.map(log => `<div class="activity-item"><span class="activity-time">[${log.time}]</span><span class="activity-user">${log.user_id}</span><span class="activity-detail">${log.detail}</span></div>`).join('');
        document.getElementById('activity-count').innerText = activityLogs.length;
    }

    // 控制仿真状态
    async function controlSim(action) {
        const res = await fetch('/api/simulation/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
        const data = await res.json();
        if (data.status === 'ok') {
            if (action === 'resume') document.getElementById('config-panel').classList.add('disabled');
            else if (action === 'pause' || action === 'stop') document.getElementById('config-panel').classList.remove('disabled');
            if (action === 'stop') {
                // 停止后可以刷新页面或提示
                alert('仿真已停止。如需重新开始，请重启程序。');
            }
        } else {
            alert('操作失败: ' + data.error);
        }
    }

    document.getElementById('btn-start').onclick = () => controlSim('resume');
    document.getElementById('btn-pause').onclick = () => controlSim('pause');
    document.getElementById('btn-stop').onclick = () => controlSim('stop');
    document.getElementById('btn-reset').onclick = async () => {
    const res = await fetch('/api/simulation/reset', { method: 'POST' });
    const data = await res.json();
    if (data.status === 'reset initiated') {
        alert('仿真已重置，页面将重新加载数据。');
        location.reload();
    } else {
        alert('重置失败：' + (data.error || '未知错误'));
    }
};

    // 加载食堂列表
    async function loadCanteens() {
        const res = await fetch('/api/canteens');
        const data = await res.json();
        let opts = '<option value="">请选择食堂</option>';
        data.forEach(c => opts += `<option value="${c.id}">${c.name}</option>`);
        document.getElementById('window-canteen-select').innerHTML = opts;
    }

    window.addCanteen = async function() {
        const name = document.getElementById('canteen-name').value;
        const seats = parseInt(document.getElementById('canteen-seats').value);
        if (!name) { alert('请输入食堂名称'); return; }
        const res = await fetch('/api/canteen/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, total_seats: seats }) });
        const data = await res.json();
        if (data.error) alert('错误: ' + data.error);
        else { alert(`食堂添加成功，ID: ${data.canteen_id}`); loadCanteens(); await rebuildCharts(); }
    };
    window.addWindow = async function() {
        const canteen_id = parseInt(document.getElementById('window-canteen-select').value);
        const name = document.getElementById('window-name').value;
        const speed = parseFloat(document.getElementById('window-speed').value);
        const window_type = document.getElementById('window-type').value;
        if (!canteen_id) { alert('请选择食堂'); return; }
        if (!name) { alert('请输入窗口名称'); return; }
        const res = await fetch('/api/window/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ canteen_id, name, speed, window_type }) });
        const data = await res.json();
        if (data.error) alert('错误: ' + data.error);
        else { alert(`窗口添加成功，全局ID: ${data.window_global_id}`); await rebuildCharts(); }
    };
    window.addDish = async function() {
        const window_global_id = document.getElementById('dish-window-select').value;
        const dish_name = document.getElementById('dish-name').value;
        const price = parseFloat(document.getElementById('dish-price').value);
        if (!window_global_id) { alert('请选择窗口'); return; }
        if (!dish_name) { alert('请输入菜品名称'); return; }
        if (isNaN(price)) { alert('请输入价格'); return; }
        const res = await fetch('/api/dish/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ window_global_id, dish_name, price }) });
        const data = await res.json();
        if (data.error) alert('错误: ' + data.error);
        else alert('菜品添加成功');
    };

    // Socket 事件
    socket.on('connect', () => { document.getElementById('conn-status').innerHTML = '✅ 已连接'; });
    socket.on('disconnect', () => { document.getElementById('conn-status').innerHTML = '❌ 已断开'; });
    socket.on('connect_error', (err) => { document.getElementById('error-msg').innerText = '连接失败: ' + err.message; });
    socket.on('history', async (snapshots) => {
        await rebuildCharts(); // 确保图表窗口名已更新
        snapshots.forEach(s => updateChartsFromSnapshot(s));
    });
    socket.on('update', (data) => {
        try { document.getElementById('last-data').innerText = `t=${data.time} | 服务=${data.total_served} | 等待=${data.avg_wait?.toFixed(2)}`; } catch(e) {}
        updateChartsFromSnapshot(data);
        document.getElementById('current-time').innerText = data.time;
        document.getElementById('total-served').innerText = data.total_served;
        document.getElementById('avg-wait').innerText = data.avg_wait?.toFixed(2) || '0.00';
        document.getElementById('error-msg').innerText = '无';
        loadCanteenStatus();
    });
    socket.on('user_activity', (activity) => addActivityLog(activity));

socket.on('simulation_end', (stats) => {
    const container = document.getElementById('final-stats');
    if (!container) return;

    const avgWait = stats.avg_wait_time ?? stats.avg_wait ?? 0;
    const totalServed = stats.total_served ?? 0;
    const occupancy = stats.avg_seat_occupancy ?? 0;

    container.innerHTML = `
        <p>仿真已结束，统计摘要如下：</p>
        <p>️ 平均等待时间：${Number(avgWait).toFixed(2)} 分钟</p>
        <p> 总服务人数：${totalServed}</p>
        <p>️ 平均座位占用率：${typeof occupancy === 'number' ? occupancy.toFixed(1) + '%' : '见详细统计'}</p>
    `;
});

    socket.on('final_statistics', (stats) => {
        const container = document.getElementById('final-stats');
        if (!container) return;
        let occupancyHtml = '';
        if (stats.avg_seat_occupancy && typeof stats.avg_seat_occupancy === 'object') {
            occupancyHtml = '<ul>';
            for (const [cid, rate] of Object.entries(stats.avg_seat_occupancy)) {
                occupancyHtml += `<li>食堂 ${cid} 占用率: ${rate.toFixed(1)}%</li>`;
            }
            occupancyHtml += '</ul>';
        } else {
            occupancyHtml = `<p>平均座位占用率: ${(stats.avg_seat_occupancy || 0).toFixed(1)}%</p>`;
        }
        container.innerHTML = `
            <p>⏱️ 平均等待时间: ${stats.avg_wait_time?.toFixed(2) || 0} 分钟</p>
            <p>👥 总服务人数: ${stats.total_served || 0}</p>
            ${occupancyHtml}
        `;
    });

    // 初始化
    rebuildCharts();
    loadCanteens();
    loadCanteenStatus();
})();
</script>
