<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员登录 | 北京交通大学食堂仿真</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 12% 15%, rgba(59,130,246,0.36), transparent 32%),
                        radial-gradient(circle at 85% 8%, rgba(14,165,233,0.32), transparent 26%),
                        linear-gradient(135deg, #0f172a 0%, #1e3a8a 42%, #0f172a 100%);
        }
        .login-card {
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 40px 36px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            transition: transform 0.2s ease;
        }
        .login-card:hover { transform: translateY(-4px); }
        .login-card h2 {
            text-align: center;
            margin-bottom: 12px;
            color: #0f172a;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .login-card .sub {
            text-align: center;
            margin-bottom: 32px;
            color: #64748b;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 15px;
            background: white;
            transition: 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .links a {
            color: #2563eb;
            text-decoration: none;
        }
        .links a:hover { text-decoration: underline; }
        .error {
            color: #ef4444;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .success {
            color: #22c55e;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>🍽️ 北京交通大学食堂仿真</h2>
    <div class="sub">管理员登录</div>
    <form method="POST" action="/login">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">登 录</button>
    </form>
    <div class="links">
        <a href="/change-password">修改密码</a>
    </div>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    {% if message %}
        <div class="success">{{ message }}</div>
    {% endif %}
</div>
</body>
</html>
