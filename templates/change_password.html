<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>修改密码 | 管理员</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 12% 15%, rgba(59,130,246,0.36), transparent 32%),
                        radial-gradient(circle at 85% 8%, rgba(14,165,233,0.32), transparent 26%),
                        linear-gradient(135deg, #0f172a 0%, #1e3a8a 42%, #0f172a 100%);
        }
        .card {
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 40px 36px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        h2 { text-align: center; margin-bottom: 24px; color: #0f172a; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; }
        .input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border: none;
            border-radius: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #2563eb; text-decoration: none; }
        .error { color: #ef4444; margin-top: 16px; text-align: center; }
        .success { color: #22c55e; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h2>修改管理员密码</h2>
    <form method="POST" action="/change-password">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" name="username" required>
        </div>
        <div class="input-group">
            <label>原密码</label>
            <input type="password" name="old_password" required>
        </div>
        <div class="input-group">
            <label>新密码</label>
            <input type="password" name="new_password" required>
        </div>
        <div class="input-group">
            <label>确认新密码</label>
            <input type="password" name="confirm_password" required>
        </div>
        <button type="submit">修 改</button>
    </form>
    <div class="links">
        <a href="/login">返回登录</a>
    </div>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}
</div>
</body>
</html>
