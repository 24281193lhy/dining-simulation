[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canteen-sim"
version = "1.0.0"
description = "北交大食堂离散事件仿真系统"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.0,<3.0",
    "flask-socketio>=5.3.0,<6.0",
    "rich>=13.5.0",
    "colorama>=0.4.6",
    "prettytable>=3.8.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
canteen-sim = "canteen_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["canteen_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
